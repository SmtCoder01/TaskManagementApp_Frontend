name: E2E Smoke Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: TaskManagementDb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Password123*
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    # 1. Setup .NET for Backend WebApi
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    # 2. Run EF Migrations / Database Updates and start Backend WebApi
    - name: Start Backend API
      run: |
        cd TaskManagementAppApi/TaskManagementApp.WebApi
        # Overwrite connection string for PostgreSQL service container
        export ConnectionStrings__DefaultConnection="Host=localhost;Port=5432;Database=TaskManagementDb;Username=postgres;Password=Password123*"
        dotnet run --launch-profile http &
      env:
        ASPNETCORE_ENVIRONMENT: Development

    # 3. Setup Node.js for Frontend
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: TaskY/package-lock.json

    # 4. Install Frontend dependencies
    - name: Install Frontend Dependencies
      run: |
        cd TaskY
        npm ci

    # 5. Install Playwright Browsers
    - name: Install Playwright Browsers
      run: |
        cd TaskY
        npx playwright install --with-deps chromium

    # 6. Run E2E Smoke Tests
    - name: Run E2E tests
      run: |
        cd TaskY
        npm run e2e
      env:
        CI: true

    # 7. Upload Playwright Report on failure
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-report
        path: TaskY/playwright-report/
        retention-days: 30
